<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Quadruple Dood</title>
    <meta name="theme-color" content="#0a0a14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Quad Dood">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="preload" href="/fonts/felipa-latin.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      @font-face {
        font-family: 'Felipa';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/felipa-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      :root {
        --font-display: Trattatello, Luminari, Felipa, fantasy;
        --font-mono: ui-monospace, 'SF Mono', Menlo, Monaco, 'Courier New', monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #game-canvas {
        background: #0a0a14;
      }
      body {
        color: #eee;
        font-family: var(--font-mono);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
      }
      #app { text-align: center; width: 100%; max-width: 680px; }
      canvas { display: block; }
      #game-canvas {
        width: 100%;
        height: auto;
        aspect-ratio: 680 / 700;
        touch-action: none;
        -webkit-touch-callout: none;
        user-select: none;
      }
      .screen { display: none; }
      .screen.active { display: block; }
      #foil-creator-screen.active { display: flex; }
      #card-version-screen.active { display: flex; }
      input, button, select {
        margin: 6px 4px;
        padding: 10px 20px;
        font-family: var(--font-mono);
        font-size: 14px;
        background: #1a1a2e;
        color: #eee;
        border: 1px solid #333;
        cursor: pointer;
      }
      button:hover { background: #222240; }
      @media (hover: none) { button:hover { background: #1a1a2e; } }
        #status { margin-top: 10px; color: #555; font-size: 13px; }
        #account-panel { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid #222; }
        #account-email, #account-name { width: min(100%, 240px); }
        #account-who { color: #444; font-size: 11px; margin: 2px 0 4px; }
        #account-record { color: #888; font-size: 13px; margin: 0 0 8px; }
        #account-status { color: #666; font-size: 12px; margin-top: 8px; min-height: 16px; }
        #lobby-account { margin-top: 16px; color: #555; font-size: 12px; }
      h2 { margin-bottom: 20px; letter-spacing: 4px; color: #cc1111; font-family: var(--font-display); font-size: clamp(36px, 13vw, 58px); font-weight: normal; }
      h2.wordmark, h2.red-title { letter-spacing: 0; }
      h2.wordmark img, h2.red-title img { display: block; margin: 0 auto; height: auto; }
      h2.wordmark img { width: clamp(168px, 61vw, 271px); }
      h2.red-title img { width: min(100%, var(--title-w, 280px)); }
      #game-menu-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 40;
        width: 36px;
        height: 36px;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 10, 20, 0.82);
        color: #ccc;
      }
      #game-menu-btn:hover { background: rgba(26, 26, 46, 0.95); color: #eee; }
      #game-menu {
        display: none;
        position: absolute;
        top: 48px;
        right: 8px;
        z-index: 41;
        background: #1a1a2e;
        border: 1px solid #333;
        padding: 6px;
        min-width: 140px;
        text-align: left;
      }
      #game-menu.open { display: block; }
      #game-menu button { display: block; width: 100%; margin: 0; text-align: left; }
      #rotate-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(10, 10, 20, 0.96);
        z-index: 300;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #eee;
        font-size: 16px;
        font-family: var(--font-mono);
        text-align: center;
        padding: 20px;
      }
      @media screen and (orientation: landscape) and (max-height: 450px) {
        #rotate-overlay { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="lobby-screen" class="screen active">
        <h2 class="wordmark"><img src="/assets/wordmark.png" alt="Quadruple dood"></h2>
        <div>
          <input id="room-name" type="text" placeholder="Room name" value="room1" style="display:none" />
          <select id="deck-select">
            <option value="random">random deck</option>
            <option value="vampire">vampire deck</option>
            <option value="werewolf">werewolf deck</option>
            <option value="ocean">ocean deck</option>
            <option value="bones">bones deck</option>
            <option value="zombie">zombie deck</option>
            <option value="oni">oni deck</option>
            <option value="spider">spider deck</option>
            <option value="knife">knife deck</option>
            <option value="demon">demon deck</option>
            <option value="clown">clown deck</option>
            <option value="succubus">succubus deck</option>
            <option value="ghost">ghost deck</option>
            <option value="robot">robot deck</option>
            <option value="dolphin">dolphin deck</option>
            <option value="debug">debug</option>
          </select>
          <button id="join-btn">sacrifice</button>
        </div>
        <p id="status">channeling…</p>
        <div style="margin-top:60px;">
          <button id="settings-btn">settings</button>
        </div>
        <p id="lobby-account" hidden></p>
        <p style="margin-top:12px; color:#333; font-size:11px; font-family:var(--font-mono);">v12.6</p>
      </div>
      <div id="game-screen" class="screen" style="position:relative;">
        <canvas id="game-canvas" width="680" height="700"></canvas>
        <p id="turn-status" style="margin-top:10px; min-height:18px; font-family:var(--font-mono); font-size:14px; color:#eee;"></p>
        <button id="game-menu-btn" type="button" aria-label="game settings" aria-haspopup="true" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.6-.22l-2.39.96a7.03 7.03 0 00-1.63-.94l-.36-2.54A.5.5 0 0014.3 2h-4.6a.5.5 0 00-.49.42l-.36 2.54c-.59.24-1.13.55-1.63.94l-2.39-.96a.5.5 0 00-.6.22L2.31 8.48a.5.5 0 00.12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.43 14.16a.5.5 0 00-.12.64l1.92 3.32c.13.23.4.32.64.22l2.39-.96c.5.39 1.04.7 1.63.94l.36 2.54c.05.24.25.42.49.42h4.6c.24 0 .44-.18.49-.42l.36-2.54c.59-.24 1.13-.55 1.63-.94l2.39.96c.24.1.51 0 .64-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/>
          </svg>
        </button>
        <div id="game-menu">
          <button id="leave-btn" type="button">leave room</button>
        </div>
      </div>
      <div id="between-screen" class="screen">
        <h2 class="wordmark"><img src="/assets/wordmark.png" alt="Quadruple dood"></h2>
        <p id="between-score" style="font-size:28px; letter-spacing:2px; margin-bottom:16px;"></p>
        <p id="between-result" style="color:#888; margin-bottom:20px; font-size:13px;"></p>
        <select id="between-deck-select">
          <option value="random">random deck</option>
          <option value="vampire">vampire deck</option>
          <option value="werewolf">werewolf deck</option>
          <option value="ocean">ocean deck</option>
          <option value="bones">bones deck</option>
          <option value="zombie">zombie deck</option>
          <option value="oni">oni deck</option>
          <option value="spider">spider deck</option>
          <option value="knife">knife deck</option>
          <option value="demon">demon deck</option>
          <option value="clown">clown deck</option>
          <option value="succubus">succubus deck</option>
          <option value="ghost">ghost deck</option>
          <option value="robot">robot deck</option>
          <option value="dolphin">dolphin deck</option>
          <option value="debug">debug</option>
        </select>
        <p id="between-deck-note" style="font-size:11px; color:#555; margin:6px 0 12px;"></p>
        <button id="ready-btn">continue sacrifice</button>
        <button id="between-leave-btn">leave room</button>
        <p id="between-status" style="margin-top:10px; color:#555; font-size:13px;"></p>
      </div>
      <div id="settings-screen" class="screen">
        <h2 class="red-title" style="--title-w:179px; margin-bottom:32px;"><img src="/assets/heading-settings.png" alt="settings"></h2>
        <div id="account-panel" hidden>
          <p style="color:#444; font-size:11px; letter-spacing:2px; text-transform:uppercase; margin-bottom:10px;">account</p>
          <div id="account-logged-out">
            <input id="account-email" type="email" placeholder="email" autocomplete="email" />
            <br>
            <button id="account-login-btn" type="button">log in</button>
          </div>
          <div id="account-logged-in" hidden>
            <div style="display:grid; grid-template-columns:auto auto; gap:12px 6px; align-items:center; justify-content:center;">
              <label for="account-name" style="color:#555; font-size:13px; text-align:right;">name</label>
              <input id="account-name" type="text" maxlength="24" autocomplete="nickname" spellcheck="false" />
            </div>
            <p id="account-who"></p>
            <p id="account-record"></p>
            <button id="account-save-btn" type="button">save name</button>
            <button id="account-logout-btn" type="button">log out</button>
          </div>
          <p id="account-status" aria-live="polite"></p>
        </div>
        <div style="display:grid; grid-template-columns:auto auto; gap:12px 6px; align-items:center; margin-bottom:20px;">
          <label style="color:#555; font-size:13px; text-align:right;">default deck</label>
          <select id="pref-deck-select">
            <option value="random">random deck</option>
            <option value="vampire">vampire deck</option>
            <option value="werewolf">werewolf deck</option>
            <option value="ocean">ocean deck</option>
            <option value="bones">bones deck</option>
            <option value="zombie">zombie deck</option>
            <option value="oni">oni deck</option>
            <option value="spider">spider deck</option>
            <option value="knife">knife deck</option>
            <option value="demon">demon deck</option>
            <option value="clown">clown deck</option>
            <option value="succubus">succubus deck</option>
            <option value="ghost">ghost deck</option>
            <option value="robot">robot deck</option>
            <option value="dolphin">dolphin deck</option>
          </select>
          <label style="color:#555; font-size:13px; text-align:right;">card art</label>
          <input type="checkbox" id="card-art-toggle">
          <label style="color:#555; font-size:13px; text-align:right;">colorblind colors</label>
          <input type="checkbox" id="colorblind-toggle">
          <label style="color:#555; font-size:13px; text-align:right;">queue vs cpu</label>
          <input type="checkbox" id="cpu-check">
          <label style="color:#555; font-size:13px; text-align:right;">foil style</label>
          <select id="foil-style-select">
            <option value="0">classic</option>
            <option value="1">dark holo</option>
            <option value="2">rainbow rare</option>
            <option value="3">custom</option>
            <option value="4">gilded edges</option>
          </select>
        </div>
        <button id="foil-creator-btn" style="margin-top:8px;">custom foil creator</button>
        <br>
        <button id="card-version-btn" style="margin-top:8px;">card version select</button>
        <br>
        <button id="settings-back-btn" style="margin-top:12px;">back</button>
      </div>
      <div id="foil-creator-screen" class="screen" style="position:fixed;inset:0;overflow-y:auto;background:#0a0a14;flex-direction:column;align-items:center;padding:40px 20px 60px;">
        <h2 class="red-title" style="--title-w:288px; margin-bottom:24px;"><img src="/assets/heading-foil-creator.png" alt="foil creator"></h2>
        <canvas id="foil-preview" width="204" height="204" style="border:1px solid #333; border-radius:8px; margin-bottom:24px;"></canvas>
        <div style="display:grid; grid-template-columns:auto 1fr auto; gap:10px 12px; align-items:center; width:100%; max-width:420px; margin-bottom:24px;">

          <span style="color:#444; font-size:11px; grid-column:1/-1; margin-top:4px; text-transform:uppercase; letter-spacing:2px;">glitter</span>
          <label style="color:#555; font-size:12px; text-align:right;">count</label>
          <input type="range" id="fc-glitter-count" min="0" max="120" step="1" style="margin:0; padding:0; background:none; border:none;">
          <span id="fc-glitter-count-val" style="color:#888; font-size:12px; min-width:32px; text-align:left;"></span>

          <label style="color:#555; font-size:12px; text-align:right;">twinkle ms</label>
          <input type="range" id="fc-glitter-period" min="200" max="5000" step="50" style="margin:0; padding:0; background:none; border:none;">
          <span id="fc-glitter-period-val" style="color:#888; font-size:12px; min-width:32px; text-align:left;"></span>

          <label style="color:#555; font-size:12px; text-align:right;">brightness</label>
          <input type="range" id="fc-glitter-alpha" min="0" max="1" step="0.01" style="margin:0; padding:0; background:none; border:none;">
          <span id="fc-glitter-alpha-val" style="color:#888; font-size:12px; min-width:32px; text-align:left;"></span>

          <label style="color:#555; font-size:12px; text-align:right;">full card</label>
          <input type="checkbox" id="fc-glitter-fullcard" style="margin:0; padding:0; background:none; border:none; width:16px; height:16px; justify-self:start;">
          <span></span>

          <span style="color:#444; font-size:11px; grid-column:1/-1; margin-top:4px; text-transform:uppercase; letter-spacing:2px;">texture</span>
          <label style="color:#555; font-size:12px; text-align:right;">cross-hatch</label>
          <input type="checkbox" id="fc-hatch-enabled" style="margin:0; padding:0; background:none; border:none; width:16px; height:16px; justify-self:start;">
          <span></span>

          <label style="color:#555; font-size:12px; text-align:right;">spacing px</label>
          <input type="range" id="fc-hatch-spacing" min="1" max="20" step="1" style="margin:0; padding:0; background:none; border:none;">
          <span id="fc-hatch-spacing-val" style="color:#888; font-size:12px; min-width:32px; text-align:left;"></span>

          <label style="color:#555; font-size:12px; text-align:right;">opacity</label>
          <input type="range" id="fc-hatch-opacity" min="0" max="0.30" step="0.005" style="margin:0; padding:0; background:none; border:none;">
          <span id="fc-hatch-opacity-val" style="color:#888; font-size:12px; min-width:32px; text-align:left;"></span>

          <span style="color:#444; font-size:11px; grid-column:1/-1; margin-top:4px; text-transform:uppercase; letter-spacing:2px;">gradient</span>
          <label style="color:#555; font-size:12px; text-align:right;">spin ms</label>
          <input type="range" id="fc-gradient-period" min="1000" max="30000" step="100" style="margin:0; padding:0; background:none; border:none;">
          <span id="fc-gradient-period-val" style="color:#888; font-size:12px; min-width:32px; text-align:left;"></span>

          <label style="color:#555; font-size:12px; text-align:right;">intensity 1</label>
          <input type="range" id="fc-gradient-op1" min="0" max="1" step="0.01" style="margin:0; padding:0; background:none; border:none;">
          <span id="fc-gradient-op1-val" style="color:#888; font-size:12px; min-width:32px; text-align:left;"></span>

          <label style="color:#555; font-size:12px; text-align:right;">intensity 2</label>
          <input type="range" id="fc-gradient-op2" min="0" max="1" step="0.01" style="margin:0; padding:0; background:none; border:none;">
          <span id="fc-gradient-op2-val" style="color:#888; font-size:12px; min-width:32px; text-align:left;"></span>

          <label style="color:#555; font-size:12px; text-align:right;">angle offset</label>
          <input type="range" id="fc-gradient-offset" min="0" max="1" step="0.01" style="margin:0; padding:0; background:none; border:none;">
          <span id="fc-gradient-offset-val" style="color:#888; font-size:12px; min-width:32px; text-align:left;"></span>

          <label style="color:#555; font-size:12px; text-align:right;">hard-light blend</label>
          <input type="checkbox" id="fc-blend-hardlight" style="margin:0; padding:0; background:none; border:none; width:16px; height:16px; justify-self:start;">
          <span></span>

          <span style="color:#444; font-size:11px; grid-column:1/-1; margin-top:4px; text-transform:uppercase; letter-spacing:2px;">sheen</span>
          <label style="color:#555; font-size:12px; text-align:right;">enabled</label>
          <input type="checkbox" id="fc-sheen-enabled" style="margin:0; padding:0; background:none; border:none; width:16px; height:16px; justify-self:start;">
          <span></span>

          <label style="color:#555; font-size:12px; text-align:right;">sweep ms</label>
          <input type="range" id="fc-sheen-period" min="500" max="10000" step="100" style="margin:0; padding:0; background:none; border:none;">
          <span id="fc-sheen-period-val" style="color:#888; font-size:12px; min-width:32px; text-align:left;"></span>

          <label style="color:#555; font-size:12px; text-align:right;">width</label>
          <input type="range" id="fc-sheen-width" min="0.05" max="0.90" step="0.01" style="margin:0; padding:0; background:none; border:none;">
          <span id="fc-sheen-width-val" style="color:#888; font-size:12px; min-width:32px; text-align:left;"></span>

          <label style="color:#555; font-size:12px; text-align:right;">brightness</label>
          <input type="range" id="fc-sheen-brightness" min="0" max="0.60" step="0.01" style="margin:0; padding:0; background:none; border:none;">
          <span id="fc-sheen-brightness-val" style="color:#888; font-size:12px; min-width:32px; text-align:left;"></span>

          <span style="color:#444; font-size:11px; grid-column:1/-1; margin-top:4px; text-transform:uppercase; letter-spacing:2px;">gradient 1 colors</span>
          <label style="color:#555; font-size:12px; text-align:right;">stop 1</label>
          <input type="color" id="fc-g1-0" style="margin:0; padding:2px; border:none; width:48px; height:28px; cursor:pointer;">
          <span></span>
          <label style="color:#555; font-size:12px; text-align:right;">stop 2</label>
          <input type="color" id="fc-g1-1" style="margin:0; padding:2px; border:none; width:48px; height:28px; cursor:pointer;">
          <span></span>
          <label style="color:#555; font-size:12px; text-align:right;">stop 3</label>
          <input type="color" id="fc-g1-2" style="margin:0; padding:2px; border:none; width:48px; height:28px; cursor:pointer;">
          <span></span>
          <label style="color:#555; font-size:12px; text-align:right;">stop 4</label>
          <input type="color" id="fc-g1-3" style="margin:0; padding:2px; border:none; width:48px; height:28px; cursor:pointer;">
          <span></span>
          <label style="color:#555; font-size:12px; text-align:right;">stop 5</label>
          <input type="color" id="fc-g1-4" style="margin:0; padding:2px; border:none; width:48px; height:28px; cursor:pointer;">
          <span></span>
          <label style="color:#555; font-size:12px; text-align:right;">stop 6</label>
          <input type="color" id="fc-g1-5" style="margin:0; padding:2px; border:none; width:48px; height:28px; cursor:pointer;">
          <span></span>

          <span style="color:#444; font-size:11px; grid-column:1/-1; margin-top:4px; text-transform:uppercase; letter-spacing:2px;">gradient 2 colors</span>
          <label style="color:#555; font-size:12px; text-align:right;">stop 1</label>
          <input type="color" id="fc-g2-0" style="margin:0; padding:2px; border:none; width:48px; height:28px; cursor:pointer;">
          <span></span>
          <label style="color:#555; font-size:12px; text-align:right;">stop 2</label>
          <input type="color" id="fc-g2-1" style="margin:0; padding:2px; border:none; width:48px; height:28px; cursor:pointer;">
          <span></span>
          <label style="color:#555; font-size:12px; text-align:right;">stop 3</label>
          <input type="color" id="fc-g2-2" style="margin:0; padding:2px; border:none; width:48px; height:28px; cursor:pointer;">
          <span></span>
          <label style="color:#555; font-size:12px; text-align:right;">stop 4</label>
          <input type="color" id="fc-g2-3" style="margin:0; padding:2px; border:none; width:48px; height:28px; cursor:pointer;">
          <span></span>
        </div>
        <button id="foil-save-btn">save as custom</button>
        <button id="foil-creator-back-btn" style="margin-top:8px;">back</button>
      </div>
      <div id="card-version-screen" class="screen" style="position:fixed;inset:0;overflow-y:auto;background:#0a0a14;flex-direction:column;align-items:center;padding:40px 20px 60px;">
        <h2 class="red-title" style="--title-w:434px; margin-bottom:24px;"><img src="/assets/heading-card-version.png" alt="card version select"></h2>
        <div id="card-version-list" style="width:100%; max-width:480px; margin-bottom:20px; color:#555; font-size:12px; text-align:center;">loading…</div>
        <button id="card-version-back-btn">back</button>
      </div>
      <div id="matchover-screen" class="screen">
        <h2 class="wordmark"><img src="/assets/wordmark.png" alt="Quadruple dood"></h2>
        <p id="matchover-result" style="font-size:28px; letter-spacing:2px; margin-bottom:8px;"></p>
        <p id="matchover-score" style="color:#888; margin-bottom:8px; font-size:13px;"></p>
        <p id="matchover-account" style="color:#555; font-size:12px; margin:0 0 20px; min-height:16px;"></p>
        <button id="rematch-btn">rematch</button>
        <button id="matchover-leave-btn">leave room</button>
      </div>
    </div>
    <div id="reconnect-overlay" style="display:none; position:fixed; inset:0; background:rgba(10,10,20,0.88); z-index:200; flex-direction:column; align-items:center; justify-content:center; gap:20px;">
      <p id="reconnect-msg" style="color:#eee; font-size:15px; font-family:var(--font-mono); text-align:center; white-space:pre-line; line-height:1.8;"></p>
      <button id="reconnect-leave-btn">leave now</button>
    </div>
    <div id="rotate-overlay">
      <p style="font-size:22px;">↺</p>
      <p>rotate your device</p>
      <p style="font-size:11px; color:#555;">this game plays best in portrait</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
