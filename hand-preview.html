<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { background: #0a0a14; color: #eee; font-family: monospace; padding: 20px; }
  h2 { color: #cc3; margin: 20px 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  canvas { display: block; }
  .label { font-size: 11px; color: #888; text-align: center; margin-top: 2px; }
  .group { display: inline-block; }
  .section { margin-bottom: 40px; border-top: 1px solid #333; padding-top: 16px; }
</style>
</head>
<body>
<h1 style="color:#c33">Oni Hand Permutations</h1>
<p style="color:#888">Each mini-scene shows the hand at a specific rotation with its capture indicator. ONI = grey square. Pick the combo that looks right and note its code (position · emoji · angle).</p>

<div id="root"></div>

<script>
const CARD = 68;
const GAP  = 4;
const CELL = CARD + GAP;

const ANGLES = [
  [0,           '0'],
  [Math.PI/4,   'π/4'],
  [Math.PI/2,   'π/2'],
  [3*Math.PI/4, '3π/4'],
  [Math.PI,     'π'],
  [-3*Math.PI/4,'−3π/4'],
  [-Math.PI/2,  '−π/2'],
  [-Math.PI/4,  '−π/4'],
];

const EMOJIS = ['🫴', '🫳'];

// capture direction → triangle drawing fn
function drawIndicator(ctx, x, y, cap) {
  const m = 6, ts = 4, mc = 7;
  const cx = x + CARD/2, cy = y + CARD/2;
  ctx.beginPath();
  switch (cap) {
    case 'up':         ctx.moveTo(cx,y+m);         ctx.lineTo(cx-ts,y+m+ts*1.5);       ctx.lineTo(cx+ts,y+m+ts*1.5);       break;
    case 'down':       ctx.moveTo(cx,y+CARD-m);     ctx.lineTo(cx-ts,y+CARD-m-ts*1.5); ctx.lineTo(cx+ts,y+CARD-m-ts*1.5); break;
    case 'left':       ctx.moveTo(x+m,cy);          ctx.lineTo(x+m+ts*1.5,cy-ts);       ctx.lineTo(x+m+ts*1.5,cy+ts);       break;
    case 'right':      ctx.moveTo(x+CARD-m,cy);     ctx.lineTo(x+CARD-m-ts*1.5,cy-ts); ctx.lineTo(x+CARD-m-ts*1.5,cy+ts); break;
    case 'up-left':    ctx.moveTo(x+mc,y+mc);       ctx.lineTo(x+mc+ts*1.5,y+mc);      ctx.lineTo(x+mc,y+mc+ts*1.5);       break;
    case 'up-right':   ctx.moveTo(x+CARD-mc,y+mc);  ctx.lineTo(x+CARD-mc-ts*1.5,y+mc); ctx.lineTo(x+CARD-mc,y+mc+ts*1.5); break;
    case 'down-left':  ctx.moveTo(x+mc,y+CARD-mc);  ctx.lineTo(x+mc+ts*1.5,y+CARD-mc); ctx.lineTo(x+mc,y+CARD-mc-ts*1.5); break;
    case 'down-right': ctx.moveTo(x+CARD-mc,y+CARD-mc); ctx.lineTo(x+CARD-mc-ts*1.5,y+CARD-mc); ctx.lineTo(x+CARD-mc,y+CARD-mc-ts*1.5); break;
  }
  ctx.fill();
}

function drawCard(ctx, x, y, emoji, angle, cap) {
  ctx.beginPath(); ctx.roundRect(x,y,CARD,CARD,6);
  ctx.fillStyle = '#f0f0f0'; ctx.fill();
  ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1; ctx.stroke();
  const cx = x+CARD/2, cy = y+CARD/2;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(angle);
  ctx.font = '28px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(emoji, 0, 0); ctx.restore();
  ctx.fillStyle = '#111';
  drawIndicator(ctx, x, y, cap);
}

function drawOni(ctx, x, y) {
  ctx.beginPath(); ctx.roundRect(x,y,CARD,CARD,6);
  ctx.fillStyle = '#2a2a3a'; ctx.fill();
  ctx.strokeStyle = '#555'; ctx.lineWidth = 1; ctx.stroke();
  ctx.font = '36px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('👹', x+CARD/2, y+CARD/2);
}

function drawEmpty(ctx, x, y) {
  ctx.beginPath(); ctx.roundRect(x,y,CARD,CARD,6);
  ctx.fillStyle = '#16213e'; ctx.fill();
  ctx.strokeStyle = '#1e2a50'; ctx.lineWidth = 1; ctx.stroke();
}

// ── positions ──────────────────────────────────────────────────────────────
// layout: where is the hand relative to oni?
// oni always drawn at (1,1) in a 3×3 grid; hand at the named position
// captureDirs: which capture directions make sense to show for this position
const POSITIONS = [
  // Cardinal preferred
  { code: 'L',  name: 'LEFT of oni',        hand:[1,0], oni:[1,1], captureDirs:['up','down','left','right'] },
  { code: 'R',  name: 'RIGHT of oni',       hand:[1,2], oni:[1,1], captureDirs:['up','down','left','right'] },
  // Cardinal fallback
  { code: 'U',  name: 'ABOVE oni',          hand:[0,1], oni:[1,1], captureDirs:['up','down','left','right'] },
  { code: 'D',  name: 'BELOW oni',          hand:[2,1], oni:[1,1], captureDirs:['up','down','left','right'] },
  // Diagonal fallback
  { code: 'UL', name: 'UPPER-LEFT of oni',  hand:[0,0], oni:[1,1], captureDirs:['up-left','up-right','down-left','down-right'] },
  { code: 'UR', name: 'UPPER-RIGHT of oni', hand:[0,2], oni:[1,1], captureDirs:['up-left','up-right','down-left','down-right'] },
  { code: 'DL', name: 'LOWER-LEFT of oni',  hand:[2,0], oni:[1,1], captureDirs:['up-left','up-right','down-left','down-right'] },
  { code: 'DR', name: 'LOWER-RIGHT of oni', hand:[2,2], oni:[1,1], captureDirs:['up-left','up-right','down-left','down-right'] },
];

const root = document.getElementById('root');

for (const pos of POSITIONS) {
  const section = document.createElement('div');
  section.className = 'section';
  const h2 = document.createElement('h2');
  h2.textContent = `[${pos.code}] — ${pos.name}`;
  section.appendChild(h2);

  for (const emoji of EMOJIS) {
    const lbl = document.createElement('div');
    lbl.style.cssText = 'color:#aaa;margin-bottom:6px';
    lbl.textContent = emoji + ':';
    section.appendChild(lbl);

    const row = document.createElement('div');
    row.className = 'row';

    for (const [angle, angleLabel] of ANGLES) {
      for (const cap of pos.captureDirs) {
        const group = document.createElement('div');
        group.className = 'group';

        const cv = document.createElement('canvas');
        cv.width = CELL*3 - GAP; cv.height = CELL*3 - GAP;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#0a0a14'; ctx.fillRect(0,0,cv.width,cv.height);

        // draw 3×3 grid of empties, then oni and hand
        for (let r = 0; r < 3; r++)
          for (let c = 0; c < 3; c++)
            drawEmpty(ctx, c*CELL, r*CELL);

        drawOni(ctx, pos.oni[1]*CELL, pos.oni[0]*CELL);
        drawCard(ctx, pos.hand[1]*CELL, pos.hand[0]*CELL, emoji, angle, cap);

        group.appendChild(cv);

        const lb = document.createElement('div');
        lb.className = 'label';
        lb.textContent = `${pos.code}·${emoji}·${angleLabel}·${cap}`;
        group.appendChild(lb);
        row.appendChild(group);
      }
    }
    section.appendChild(row);
  }
  root.appendChild(section);
}
</script>
</body>
</html>
